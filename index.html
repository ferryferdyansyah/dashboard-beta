<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analisis Penggunaan Tanah</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Analisis Penggunaan Tanah</h1>
  <select id="kab" title="Filter kabupaten/kota" disabled><option value="">Semua kabupaten</option></select>
  <select id="kec" title="Filter kecamatan" disabled><option value="">Semua kecamatan</option></select>
  <button class="btn" id="pick"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>Unggah ZIP Shapefile</button>
  <input type="file" id="file" accept=".zip" hidden>
</header>
<main>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="empty">
      <svg class="i" style="width:44px;height:44px" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <div><b>Tarik dan lepas file .zip shapefile di sini</b><br><span style="opacity:.8">atau klik tombol Unggah. ZIP harus berisi .shp, .dbf, dan sebaiknya .prj</span></div>
    </div>
    <div id="sym">
      <div class="sh" id="sht"><svg class="i" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Simbologi dan Legenda<span style="flex:1"></span><svg class="i chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
      <div id="sb">
        <div class="sr"><span>Opasitas</span><input type="range" id="op" min="0" max="100" value="60"><b id="opv">60%</b></div>
        <div class="sr"><label><input type="checkbox" id="ol" checked> Garis tepi</label><span style="flex:1"></span>
          <button class="btn sm" id="sty">Impor .stylx</button><button class="btn sm" id="rst" style="background:#64748b">Reset</button></div>
        <input type="file" id="sfile" accept=".stylx" hidden>
        <div id="ss" class="mu" style="margin-bottom:4px"></div>
        <div id="lgtools">
          <input id="lgq" type="search" placeholder="Cari kategori..." autocomplete="off">
          <button class="mini" id="lgon" title="Tampilkan semua kategori">Semua</button>
          <button class="mini" id="lgoff" title="Sembunyikan semua kategori">Kosong</button>
        </div>
        <div id="lgttl"></div>
        <div id="lg"></div>
      </div>
    </div>
    <div id="load"><div id="lt">Memuat...</div><div class="bar"><i id="lb"></i></div></div>
  </div>
  <section id="panel">
    <nav id="nav"></nav>
    <div id="content"><p class="mu">Hasil analisis akan tampil di sini setelah data diunggah.</p></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<script src="app.js"></script>
</body>
</html>
